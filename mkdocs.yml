site_name: COPP Documentation
site_url: https://docs.copp.pro/
repo_url: https://github.com/TOPP-THU/copp
repo_name: TOPP-THU/copp
docs_dir: docs
site_dir: site
use_directory_urls: true
hooks:
  - tools/mkdocs_ignore_static_api_links.py

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link

nav:
  - 首页: index.md
  - API:
      - Rust latest: https://docs.rs/copp/latest/copp/
      - Rust v0.2.1: /rust/v0.2.1/copp/
      - C v0.2.0: /c/v0.2.0/
      - Python PyPI: https://pypi.org/project/copp-py/

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - admonition
  - footnotes
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/mathjax/es5/tex-mml-chtml.js
  - javascripts/copp-tabs.js
  - javascripts/code-copy.js
  - javascripts/toc-cleanup.js

extra_css:
  - stylesheets/extra.css
